<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="15 profile views">
  <defs>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="180">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="iconGradient" x1="25" y1="20" x2="95" y2="105">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="numberGradient" x1="150" y1="68" x2="265" y2="135">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black neon card -->
  <rect
    x="3"
    y="3"
    width="894"
    height="174"
    rx="22"
    fill="#030303"
    stroke="url(#cardBorder)"
    stroke-width="2"
  />

  <rect
    x="14"
    y="14"
    width="872"
    height="152"
    rx="16"
    fill="#090B10"
  />

  <!-- Eye icon -->
  <g transform="translate(39 51)" filter="url(#softGlow)">
    <path
      d="M2 39 C18 13 67 13 84 39 C67 65 18 65 2 39 Z"
      fill="none"
      stroke="url(#iconGradient)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="43" cy="39" r="15" fill="#05070B" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="43" cy="39" r="7" fill="#00E5FF"/>
    <circle cx="47" cy="35" r="2.5" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Heading -->
  <text
    x="150"
    y="48"
    fill="#8B949E"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="15"
    font-weight="700"
    letter-spacing="4"
  >PROFILE VIEWS</text>

  <!-- Actual displayed count -->
  <text
    x="150"
    y="126"
    fill="url(#numberGradient)"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-weight="700"
  >15</text>

  <!-- Supporting message -->
  <text
    x="270"
    y="91"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="700"
  >Visitors and counting</text>

  <text
    x="270"
    y="125"
    fill="#EC4899"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-weight="700"
  >Thank you for being part of my coding journey.</text>

  <!-- Decorative line -->
  <line x1="270" y1="139" x2="745" y2="139" stroke="#21262D" stroke-width="1"/>

  <!-- Decorative dots -->
  <circle cx="840" cy="48" r="5" fill="#00E5FF"/>
  <circle cx="860" cy="48" r="5" fill="#7C3AED"/>
  <circle cx="880" cy="48" r="5" fill="#EC4899"/>
</svg>
