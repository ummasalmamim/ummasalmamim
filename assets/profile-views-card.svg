<svg xmlns="http://www.w3.org/2000/svg"
    width="960" height="210"
    viewBox="0 0 960 210">

  <defs>
    <filter id="cyan-glow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur
          stdDeviation="4"
          result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%"
            stop-color="#070A10"/>
      <stop offset="100%"
            stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2"
        width="956" height="206"
        rx="23"
        fill="#000000"
        stroke="#00F7FF"
        stroke-width="2"/>

  <rect x="12" y="12"
        width="936" height="186"
        rx="17"
        fill="url(#background)"/>

  <!-- Eye icon -->
  <g filter="url(#cyan-glow)">
    <path d="M65 101
             Q108 58 151 101
             Q108 144 65 101 Z"
          fill="none"
          stroke="#00F7FF"
          stroke-width="4"/>

    <circle cx="108" cy="101"
            r="17"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="5"/>

    <circle cx="108" cy="101"
            r="8"
            fill="#00F7FF"/>
  </g>

  <!-- Title -->
  <text x="180" y="49"
        fill="#8B949E"
        font-family="Georgia,serif"
        font-size="17"
        font-weight="bold"
        letter-spacing="4">
    PROFILE VIEWS
  </text>

  <!-- Dynamic view number -->
  <text x="180" y="142"
        fill="#FFFFFF"
        font-family="Georgia,serif"
        font-size="76"
        font-weight="bold">
    64
  </text>

  <!-- Description -->
  <text x="380" y="93"
        fill="#FFFFFF"
        font-family="Georgia,serif"
        font-size="25"
        font-weight="bold">
    Visitors and counting
  </text>

  <text x="380" y="130"
        fill="#FF1493"
        font-family="Georgia,serif"
        font-size="18"
        font-weight="bold">
    Thank you for visiting my profile!
  </text>

  <line x1="380" y1="145"
        x2="815" y2="145"
        stroke="#30363D"/>

  <!-- Last updated date -->
  <text x="380" y="172"
        fill="#A78BFA"
        font-family="monospace"
        font-size="14">
    Last updated: 26 Oct 2026, 12:55 UTC
  </text>

  <!-- Decorative dots -->
  <circle cx="895" cy="42"
          r="5" fill="#00F7FF"/>

  <circle cx="915" cy="42"
          r="5" fill="#8B5CF6"/>

  <circle cx="935" cy="42"
          r="5" fill="#FF1493"/>

</svg>