<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution Badge">
  <defs>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="180">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="20" y1="15" x2="95" y2="105">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="894" height="174" rx="22" fill="#030303" stroke="url(#cardBorder)" stroke-width="2"/>
  <rect x="14" y="14" width="872" height="152" rx="16" fill="#090B10"/>

  <!-- Badge icon -->
  <g transform="translate(39 49)" filter="url(#softGlow)">
    <circle cx="43" cy="41" r="39" fill="#05070B" stroke="url(#iconGradient)" stroke-width="2.5"/>
    <circle cx="43" cy="33" r="19" fill="none" stroke="url(#iconGradient)" stroke-width="4"/>
    <path d="M31 50 L27 72 L43 62 L59 72 L55 50" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <path d="M43 20 L47 29 L57 30 L49 37 L52 47 L43 42 L34 47 L37 37 L29 30 L39 29 Z" fill="#EC4899"/>
  </g>

  <text x="150" y="48" fill="#8B949E" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="4">CONTRIBUTION BADGE</text>
  <text x="150" y="86" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">Celebrating progress, consistency,</text>
  <text x="150" y="124" fill="#A855F7" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">and meaningful contributions.</text>

  <circle cx="840" cy="48" r="5" fill="#00E5FF"/>
  <circle cx="860" cy="48" r="5" fill="#7C3AED"/>
  <circle cx="880" cy="48" r="5" fill="#EC4899"/>
</svg>
