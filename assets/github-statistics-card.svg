<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Statistics">
  <defs>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="180">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="20" y1="15" x2="95" y2="105">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="894" height="174" rx="22" fill="#030303" stroke="url(#cardBorder)" stroke-width="2"/>
  <rect x="14" y="14" width="872" height="152" rx="16" fill="#090B10"/>

  <!-- Statistics icon -->
  <g transform="translate(39 49)" filter="url(#softGlow)">
    <circle cx="43" cy="41" r="39" fill="#05070B" stroke="url(#iconGradient)" stroke-width="2.5"/>
    <path d="M17 61 V45 H29 V61 M37 61 V33 H49 V61 M57 61 V20 H69 V61" fill="none" stroke="url(#iconGradient)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M14 66 H72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M17 37 L31 29 L43 36 L66 16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="37" r="3.5" fill="#00E5FF"/>
    <circle cx="31" cy="29" r="3.5" fill="#7C3AED"/>
    <circle cx="43" cy="36" r="3.5" fill="#00E5FF"/>
    <circle cx="66" cy="16" r="3.5" fill="#EC4899"/>
  </g>

  <text x="150" y="48" fill="#8B949E" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="4">GITHUB STATISTICS</text>
  <text x="150" y="86" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">A snapshot of my GitHub journey</text>
  <text x="150" y="124" fill="#00E5FF" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">through commits, repositories, and activity.</text>

  <circle cx="840" cy="48" r="5" fill="#00E5FF"/>
  <circle cx="860" cy="48" r="5" fill="#7C3AED"/>
  <circle cx="880" cy="48" r="5" fill="#EC4899"/>
</svg>
