<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MY PROGRAMMING LANGUAGES">
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="150">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="82" y2="76">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="894" height="144" rx="23" fill="#030303" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="14" y="14" width="872" height="122" rx="17" fill="#090B10"/>
  <rect x="14" y="14" width="6" height="122" rx="3" fill="#A855F7"/>

  <g transform="translate(43 37)" filter="url(#glow)">
    <circle cx="41" cy="38" r="35" fill="#05070B" stroke="url(#iconGrad)" stroke-width="2"/>
    
    <path d="M28 24 L14 38 L28 52" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54 24 L68 38 L54 52" fill="none" stroke="#EC4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 18 L35 58" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  </g>

  <text x="130" y="64" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">MY PROGRAMMING LANGUAGES</text>
  <text x="130" y="94" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.7">REPOSITORIES • COMMITS • TECHNOLOGY DISTRIBUTION</text>
  <line x1="130" y1="111" x2="765" y2="111" stroke="#21262D" stroke-width="1"/>
  <circle cx="840" cy="45" r="5" fill="#00E5FF"/>
  <circle cx="860" cy="45" r="5" fill="#7C3AED"/>
  <circle cx="880" cy="45" r="5" fill="#EC4899"/>
