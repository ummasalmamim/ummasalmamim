<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution Activity">
  <defs>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="180">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="15" y1="15" x2="100" y2="105">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="894" height="174" rx="22" fill="#030303" stroke="url(#cardBorder)" stroke-width="2"/>
  <rect x="14" y="14" width="872" height="152" rx="16" fill="#090B10"/>

  <!-- Activity icon -->
  <g transform="translate(39 49)" filter="url(#softGlow)">
    <circle cx="43" cy="41" r="39" fill="#05070B" stroke="url(#iconGradient)" stroke-width="2.5"/>
    <path d="M10 42 H23 L30 23 L39 61 L48 34 L55 42 H76" fill="none" stroke="url(#iconGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="42" r="4" fill="#FFFFFF"/>
    <circle cx="76" cy="42" r="4" fill="#EC4899"/>
  </g>

  <text x="150" y="48" fill="#8B949E" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="4">CONTRIBUTION ACTIVITY</text>
  <text x="150" y="86" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">A visual timeline of my coding</text>
  <text x="150" y="124" fill="#00E5FF" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">and contribution journey.</text>

  <circle cx="840" cy="48" r="5" fill="#00E5FF"/>
  <circle cx="860" cy="48" r="5" fill="#7C3AED"/>
  <circle cx="880" cy="48" r="5" fill="#EC4899"/>
</svg>
