<svg
  width="900"
  height="380"
  viewBox="0 0 900 380"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Current focus: Computer Vision project, learning JavaScript React Unix and AI Pipelines, and available to discuss Python HTML CSS and PHP"
>
  <defs>
    <linearGradient id="focusBorder" x1="0" y1="0" x2="900" y2="380">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="focusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main black card -->
  <rect
    x="3"
    y="3"
    width="894"
    height="374"
    rx="24"
    fill="#030303"
    stroke="url(#focusBorder)"
    stroke-width="2"
  />

  <rect
    x="14"
    y="14"
    width="872"
    height="352"
    rx="18"
    fill="#090B10"
  />

  <!-- Header -->
  <text
    x="34"
    y="49"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="700"
  >
    CURRENT FOCUS
  </text>

  <text
    x="34"
    y="70"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="3"
  >
    BUILDING • LEARNING • SHARING
  </text>

  <circle cx="840" cy="45" r="5" fill="#00E5FF"/>
  <circle cx="860" cy="45" r="5" fill="#7C3AED"/>
  <circle cx="880" cy="45" r="5" fill="#EC4899"/>

  <!-- Row 1: Working on -->
  <rect x="30" y="91" width="840" height="76" rx="15" fill="#05070B" stroke="#183B45" stroke-width="1.5"/>
  <rect x="30" y="91" width="6" height="76" rx="3" fill="#00E5FF"/>

  <g transform="translate(55 108)" filter="url(#focusGlow)">
    <circle cx="21" cy="21" r="19" fill="#07161A" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="21" cy="21" r="10" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="21" cy="21" r="3.5" fill="#FFFFFF"/>
    <path d="M21 0 V7 M21 35 V42 M0 21 H7 M35 21 H42" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="118" y="119" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">
    CURRENTLY WORKING ON
  </text>
  <text x="118" y="148" fill="#00E5FF" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">
    Computer Vision Project
  </text>

  <!-- Row 2: Learning -->
  <rect x="30" y="181" width="840" height="76" rx="15" fill="#05070B" stroke="#342154" stroke-width="1.5"/>
  <rect x="30" y="181" width="6" height="76" rx="3" fill="#A855F7"/>

  <g transform="translate(55 198)" filter="url(#focusGlow)">
    <circle cx="21" cy="21" r="19" fill="#130B20" stroke="#A855F7" stroke-width="2"/>
    <path d="M10 12 H20 C24 12 26 15 26 19 V31 C24 28 21 27 17 27 H10 Z" fill="none" stroke="#A855F7" stroke-width="2" stroke-linejoin="round"/>
    <path d="M32 12 H22 C18 12 16 15 16 19 V31 C18 28 21 27 25 27 H32 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <text x="118" y="209" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">
    CURRENTLY LEARNING
  </text>
  <text x="118" y="238" fill="#A855F7" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">
    JavaScript • React • Unix • AI Pipelines
  </text>

  <!-- Row 3: Ask me about -->
  <rect x="30" y="271" width="840" height="76" rx="15" fill="#05070B" stroke="#4C193B" stroke-width="1.5"/>
  <rect x="30" y="271" width="6" height="76" rx="3" fill="#EC4899"/>

  <g transform="translate(55 288)" filter="url(#focusGlow)">
    <circle cx="21" cy="21" r="19" fill="#1B0A16" stroke="#EC4899" stroke-width="2"/>
    <path d="M10 12 H32 V27 H21 L14 33 V27 H10 Z" fill="none" stroke="#EC4899" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="16" cy="20" r="1.8" fill="#FFFFFF"/>
    <circle cx="21" cy="20" r="1.8" fill="#FFFFFF"/>
    <circle cx="26" cy="20" r="1.8" fill="#FFFFFF"/>
  </g>

  <text x="118" y="299" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">
    ASK ME ABOUT
  </text>
  <text x="118" y="328" fill="#EC4899" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">
    Python • HTML • CSS • PHP
  </text>
</svg>
