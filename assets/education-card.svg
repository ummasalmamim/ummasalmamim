<svg
  width="900"
  height="180"
  viewBox="0 0 900 180"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="CSE student at BRAC University"
>
  <defs>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="180">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="iconGradient" x1="25" y1="25" x2="95" y2="100">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black card -->
  <rect
    x="3"
    y="3"
    width="894"
    height="174"
    rx="22"
    fill="#030303"
    stroke="url(#cardBorder)"
    stroke-width="2"
  />

  <rect
    x="14"
    y="14"
    width="872"
    height="152"
    rx="16"
    fill="#090B10"
  />

  <!-- Graduation cap -->
  <g transform="translate(38 55)" filter="url(#softGlow)">
    <path
      d="M0 25 L43 5 L86 25 L43 45 Z"
      fill="url(#iconGradient)"
    />

    <path
      d="M17 34 V51 C27 63 59 63 69 51 V34"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="4"
      stroke-linecap="round"
    />

    <path
      d="M86 25 V56"
      stroke="#EC4899"
      stroke-width="4"
      stroke-linecap="round"
    />

    <circle cx="86" cy="61" r="5" fill="#EC4899"/>
  </g>

  <!-- Heading -->
  <text
    x="150"
    y="48"
    fill="#8B949E"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="15"
    font-weight="700"
    letter-spacing="4"
  >
    EDUCATION
  </text>

  <!-- First line -->
  <text
    x="150"
    y="86"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="700"
  >
    I am a student of Computer Science and Engineering
  </text>

  <!-- Second line -->
  <text
    x="150"
    y="124"
    fill="#00E5FF"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="700"
  >
    (CSE) at BRAC University.
  </text>

  <!-- Decorative dots -->
  <circle cx="840" cy="48" r="5" fill="#00E5FF"/>
  <circle cx="860" cy="48" r="5" fill="#7C3AED"/>
  <circle cx="880" cy="48" r="5" fill="#EC4899"/>
</svg>
