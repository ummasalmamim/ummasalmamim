
name: Update Profile Views Card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate black theme profile views card
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          USERNAME = "ummasalmamim"

          url = (
              "https://komarev.com/ghpvc/"
              f"?username={USERNAME}"
              "&label=Views"
              "&color=00F7FF"
              "&style=flat"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "GitHub-Profile-Views-Updater",
                  "Cache-Control": "no-cache"
              }
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              badge = response.read()

          root = ET.fromstring(badge)

          values = []

          for element in root.iter():
              if element.tag.rsplit("}", 1)[-1] != "text":
                  continue

              value = "".join(
                  element.itertext()
              ).strip()

              if re.fullmatch(r"[\d,]+", value):
                  values.append(value)

          if not values:
              raise RuntimeError(
                  "Could not read the Komarev view count. "
                  "Existing SVG will remain unchanged."
              )

          count = int(values[-1].replace(",", ""))
          formatted_count = f"{count:,}"

          updated = datetime.now(
              timezone.utc
          ).strftime("%d %b %Y, %H:%M UTC")

          font_size = (
              76 if len(formatted_count) <= 5
              else 61 if len(formatted_count) <= 7
              else 48
          )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="960" height="210"
              viewBox="0 0 960 210">

            <defs>
              <filter id="cyan-glow"
                      x="-50%" y="-50%"
                      width="200%" height="200%">
                <feGaussianBlur
                    stdDeviation="4"
                    result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <linearGradient id="background"
                              x1="0" y1="0"
                              x2="1" y2="1">
                <stop offset="0%"
                      stop-color="#070A10"/>
                <stop offset="100%"
                      stop-color="#000000"/>
              </linearGradient>
            </defs>

            <rect x="2" y="2"
                  width="956" height="206"
                  rx="23"
                  fill="#000000"
                  stroke="#00F7FF"
                  stroke-width="2"/>

            <rect x="12" y="12"
                  width="936" height="186"
                  rx="17"
                  fill="url(#background)"/>

            <!-- Eye icon -->
            <g filter="url(#cyan-glow)">
              <path d="M65 101
                       Q108 58 151 101
                       Q108 144 65 101 Z"
                    fill="none"
                    stroke="#00F7FF"
                    stroke-width="4"/>

              <circle cx="108" cy="101"
                      r="17"
                      fill="none"
                      stroke="#FFFFFF"
                      stroke-width="5"/>

              <circle cx="108" cy="101"
                      r="8"
                      fill="#00F7FF"/>
            </g>

            <!-- Title -->
            <text x="180" y="49"
                  fill="#8B949E"
                  font-family="Georgia,serif"
                  font-size="17"
                  font-weight="bold"
                  letter-spacing="4">
              PROFILE VIEWS
            </text>

            <!-- Dynamic view number -->
            <text x="180" y="142"
                  fill="#FFFFFF"
                  font-family="Georgia,serif"
                  font-size="{font_size}"
                  font-weight="bold">
              {formatted_count}
            </text>

            <!-- Description -->
            <text x="380" y="93"
                  fill="#FFFFFF"
                  font-family="Georgia,serif"
                  font-size="25"
                  font-weight="bold">
              Visitors and counting
            </text>

            <text x="380" y="130"
                  fill="#FF1493"
                  font-family="Georgia,serif"
                  font-size="18"
                  font-weight="bold">
              Thank you for visiting my profile!
            </text>

            <line x1="380" y1="145"
                  x2="815" y2="145"
                  stroke="#30363D"/>

            <!-- Last updated date -->
            <text x="380" y="172"
                  fill="#A78BFA"
                  font-family="monospace"
                  font-size="14">
              Last updated: {updated}
            </text>

            <!-- Decorative dots -->
            <circle cx="895" cy="42"
                    r="5" fill="#00F7FF"/>

            <circle cx="915" cy="42"
                    r="5" fill="#8B5CF6"/>

            <circle cx="935" cy="42"
                    r="5" fill="#FF1493"/>

          </svg>'''

          path = Path("assets/profile-views-card.svg")
          path.parent.mkdir(
              parents=True, exist_ok=True
          )
          path.write_text(
              svg, encoding="utf-8"
          )

          print("Profile views:", formatted_count)
          print("Last updated:", updated)
          PY

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-views-card.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update profile views counter"
            git push
          fi
